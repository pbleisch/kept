# The nightly macOS leg, run only when main changed in the last day. A manual
# dispatch runs it regardless.
name: nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.main.outputs.changed }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo changed=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=1" --jq length)
          echo "commits on main since $since: $count"
          if [ "$count" -gt 0 ]; then
            echo changed=true >>"$GITHUB_OUTPUT"
          fi

  macos:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    uses: ./.github/workflows/macos.yml
