type: promise
label: Promise
description: A commitment about the world, checked on a cadence
icon: "🤝"

# Which fields the standing and truth records are keyed to. Change this list
# and every promise is re-hashed and drops standing at once — see
# docs/decision/0003.
#
# `repair` binds because repair.scope is the bound on what may be changed in
# this promise's name, which is the commitment. `max_age` deliberately does not:
# it is how often kept re-asks, not what is owed, and binding it would charge a
# re-ratification for tuning a schedule. See docs/decision/0047.
hash: [statement, gather, hold_when, trigger, repair]

fields:
  statement:
    type: string
    required: true
    description: "The binding one-liner. What must be true."
  gather:
    type: map
    description: "Named gatherers the predicate reads. Empty is legal but then nothing is checked."
  hold_when:
    type: string
    description: "A predicate over obs.<name>. Empty means this binds without being evaluated."
  trigger:
    type: enum
    values: [cadence, on-act, once]
    default: cadence
  max_age:
    type: string
    description: "How old this promise's answer may be before it is due again — 7d, 12h. Absent means due only when its scope moves."
  repair:
    type: map
    description: "scope: which paths a repair may change. Fail-closed; out-of-scope paths are reported, never landed."

# The body is the why, and it is given to whoever repairs this.
body: why

links:
  allowed_relations: [serves, cites, supersedes, realizes]
